# ===========================================================================
# .tmux.conf — tmux の設定ファイル
#
# tmux は1つのターミナルウィンドウを複数のペイン（区画）に分割できるツール。
# この設定では:
#   - マウス操作を有効にする
#   - ウィンドウ番号を 1 から始める（0 始まりだと左端のキーが遠いため）
#   - prefix + r で設定ファイルを再読み込みできるようにする
# ===========================================================================

# ---------------------------------------------------------------------------
# 基本設定
# ---------------------------------------------------------------------------
set  -g mouse on               # マウスでペイン選択・リサイズ・スクロールができる
set  -g history-limit 100000   # スクロールバックの行数（多めに設定）
set  -g base-index 1           # ウィンドウ番号を 1 から始める
setw -g pane-base-index 1      # ペイン番号も 1 から始める
set  -g renumber-windows on    # ウィンドウを閉じたら番号を詰め直す
set  -g default-shell /bin/zsh # デフォルトシェルを zsh にする

# ---------------------------------------------------------------------------
# キーバインド
# ---------------------------------------------------------------------------
# prefix + r で設定ファイルを再読み込み（変更をすぐ反映したいとき用）
bind r source-file ~/.tmux.conf \; display-message "tmux.conf を再読み込みしました"

# ---------------------------------------------------------------------------
# ステータスバー（画面下部の情報バー）
# ---------------------------------------------------------------------------
set -g status on               # ステータスバーを表示する
set -g status-position bottom  # 画面の下に配置する
set -g status-interval 2       # 2秒ごとに表示を更新する
set -g status-style "bg=black,fg=white"
